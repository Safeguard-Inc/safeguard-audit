name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit on the default branch.
    - cron: "17 3 * * 1"

jobs:
  audit:
    name: dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit dependencies
        run: cargo audit --file Cargo.lock

  deny:
    name: advisories · licenses · sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable

      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          arguments: --all-features