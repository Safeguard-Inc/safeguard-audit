name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit on the default branch.
    - cron: "17 3 * * 1"

jobs:
  audit:
    name: dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit dependencies
        run: cargo audit --file Cargo.lock

  deny:
    name: advisories · licenses · sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny-action runs in its own container with a pinned cargo-deny
      # binary, so no host Rust toolchain is needed here.
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check