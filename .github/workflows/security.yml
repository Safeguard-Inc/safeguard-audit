name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit on the default branch.
    - cron: "17 3 * * 1"

jobs:
  audit:
    name: dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit dependencies
        run: cargo audit --file Cargo.lock

  deny:
    name: advisories · licenses · sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cargo-deny-action runs in its own container with a pinned cargo-deny
      # binary, so no host Rust toolchain is needed here.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check