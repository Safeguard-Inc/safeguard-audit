name: ci

on:
  push:
    branches: [main]
  pull_request:

# One active run per (workflow, ref): a rapid push sequence supersedes stale
# runs instead of queueing them, while scheduled sweeps never cancel work
# that is already in flight on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  workflow-lint:
    name: workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate every workflow with actionlint before anything else runs.
      # This gate exists because a workflow file GitHub rejects at validation
      # time (e.g. a step-level-only context such as `secrets` referenced in
      # a job-level `if`) surfaces as a zero-job failure that YAML parsers
      # silently tolerate — and a broken release pipeline then hides behind
      # a green CI. The binary is pinned to an exact release and verified
      # against the upstream checksum before use: a compromised download or
      # a silently changed "latest" artifact cannot weaken the gate.
      - name: Lint workflow files (pinned actionlint, checksum-verified)
        run: |
          # Release assets are served from a CDN that intermittently answers
          # with a short, truncated or otherwise corrupt 200 body. The fetch
          # and the checksum check are therefore retried as a single atomic
          # unit: a body that does not match the pinned digest is discarded
          # and refetched, so a transient CDN fault cannot redden main. The
          # pinned digest is still the only thing that can make the step
          # succeed -- a persistently wrong artifact fails once the attempts
          # are exhausted, and the job never falls back to a weaker binary.
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ACTIONLINT_URL="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          fetched=0
          for attempt in 1 2 3 4 5; do
            rm -f /tmp/actionlint.tar.gz
            if curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
                 -o /tmp/actionlint.tar.gz "$ACTIONLINT_URL" \
              && test -s /tmp/actionlint.tar.gz \
              && echo "$ACTIONLINT_SHA256  /tmp/actionlint.tar.gz" | sha256sum --check --status --; then
              echo "actionlint archive checksum-verified on attempt ${attempt}"
              fetched=1
              break
            fi
            echo "::warning::actionlint download did not verify on attempt ${attempt}; retrying"
            sleep $((attempt * 2))
          done
          if [ "$fetched" -ne 1 ]; then
            echo "::error::no checksum-verified actionlint archive after 5 attempts"
            exit 1
          fi
          rm -rf /tmp/actionlint && mkdir -p /tmp/actionlint
          tar xzf /tmp/actionlint.tar.gz -C /tmp/actionlint
          /tmp/actionlint/actionlint -color

  checks:
    name: fmt · clippy · tests · schemas
    runs-on: ubuntu-latest
    # Bounded runtime: a hung job fails fast instead of burning the 6-hour
    # runner default (the gate completes in ~5 minutes locally).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the exact release pinned in rust-toolchain.toml and fails if
      # the version that resolves is not the pin. Previously this step asked
      # for `stable` explicitly, which made the pin in the toolchain file
      # decorative for every job here.
      - name: Install the pinned Rust toolchain
        run: scripts/install-toolchain.sh --component rustfmt --component clippy

      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: shellcheck

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Validate schemas and fixtures
        run: |
          python3 -m pip install jsonschema
          bash scripts/check-schema.sh

      # The error taxonomy is public API: other repositories branch on these
      # codes. Fail the build when a variant, its stable code or its rendered
      # documentation drifts from the others.
      - name: Validate the error catalog
        run: bash scripts/check-errors.sh

      - name: Lint and syntax-check shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          shellcheck --severity=style scripts/*.sh

  coverage:
    name: Coverage gate (≥80% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # llvm-tools-preview is CI-only (the coverage job); it is not in the
      # toolchain file because a contributor does not need it.
      - name: Install the pinned Rust toolchain
        run: scripts/install-toolchain.sh --component llvm-tools-preview

      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-llvm-cov

      - name: Coverage gate (scripts/coverage.sh)
        run: bash scripts/coverage.sh
