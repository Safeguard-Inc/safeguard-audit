name: ci

on:
  push:
    branches: [main]
  pull_request:

# One active run per (workflow, ref): a rapid push sequence supersedes stale
# runs instead of queueing them, while scheduled sweeps never cancel work
# that is already in flight on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  workflow-lint:
    name: workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate every workflow with actionlint before anything else runs.
      # This gate exists because a workflow file GitHub rejects at validation
      # time (e.g. a step-level-only context such as `secrets` referenced in
      # a job-level `if`) surfaces as a zero-job failure that YAML parsers
      # silently tolerate — and a broken release pipeline then hides behind
      # a green CI. The binary is pinned to an exact release and verified
      # against the upstream checksum before use: a compromised download or
      # a silently changed "latest" artifact cannot weaken the gate.
      - name: Lint workflow files (pinned actionlint, checksum-verified)
        run: |
          # Release assets are served from a CDN that occasionally answers
          # with an empty 200; retry, then refuse to checksum an empty body.
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          test -s /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check --
          mkdir /tmp/actionlint && tar xzf /tmp/actionlint.tar.gz -C /tmp/actionlint
          /tmp/actionlint/actionlint -color

  checks:
    name: fmt · clippy · tests · schemas
    runs-on: ubuntu-latest
    # Bounded runtime: a hung job fails fast instead of burning the 6-hour
    # runner default (the gate completes in ~5 minutes locally).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: shellcheck

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Validate schemas and fixtures
        run: |
          python3 -m pip install jsonschema
          bash scripts/check-schema.sh

      - name: Lint and syntax-check shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          shellcheck --severity=style scripts/*.sh

  coverage:
    name: Coverage gate (≥80% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable llvm-tools-preview

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-llvm-cov

      - name: Coverage gate (scripts/coverage.sh)
        run: bash scripts/coverage.sh
