name: ci

on:
  push:
    branches: [main]
  pull_request:

# One active run per (workflow, ref): a rapid push sequence supersedes stale
# runs instead of queueing them, while scheduled sweeps never cancel work
# that is already in flight on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  checks:
    name: fmt · clippy · tests · schemas
    runs-on: ubuntu-latest
    # Bounded runtime: a hung job fails fast instead of burning the 6-hour
    # runner default (the gate completes in ~5 minutes locally).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Validate schemas and fixtures
        run: |
          python3 -m pip install jsonschema
          bash scripts/check-schema.sh

  coverage:
    name: Coverage gate (≥80% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable llvm-tools-preview

      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-llvm-cov

      - name: Coverage gate (scripts/coverage.sh)
        run: bash scripts/coverage.sh
