version: 2
updates:
  # Cargo workspace dependencies. Bumps are validated by the CI gate
  # (fmt, clippy, tests, schemas) before merge.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions workflows: pin and update the actions the pipeline uses.
  # Minor and patch bumps are grouped into a single weekly PR (each still
  # passes the full gate before merge) so routine updates do not fragment
  # into a stream of one-line PRs; major bumps stay separate for individual
  # review.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"