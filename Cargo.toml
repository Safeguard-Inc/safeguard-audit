[workspace]
resolver = "2"
members = [
    "crates/audit-core",
    "crates/audit-events",
    "crates/authorization",
    "crates/event-indexer",
    "crates/event-normalizer",
    "crates/evidence",
    "crates/integration-tests",
    "crates/integrity",
    "crates/investigation",
    "crates/storage",
    "crates/memory-store",
    "crates/privacy",
    "crates/reporting",
    "crates/rpc",
    "crates/soroban",
]

[workspace.package]
version = "0.1.0"
description = "Verification layer for the Safeguard compliance stack on Stellar Confidential Tokens: append-only audit records, chained integrity digests, investigation, evidence, and reproducible reports."
documentation = "https://docs.rs/safeguard-audit"
authors = ["Safeguard Inc."]
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/Safeguard-Inc/safeguard-audit"
keywords = ["stellar", "soroban", "confidential-tokens", "audit", "compliance"]
categories = ["cryptography", "database"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# Shared lint policy: no unsafe code anywhere in the workspace. Mirrors the
# sibling polyrepos; the audit layer is verification infrastructure and
# hand-written unsafe has no legitimate use here. (No member of this
# workspace uses proc-macro harnesses that emit `allow(unsafe_code)`, so
# unlike safeguard-hooks this can use the absolute forbid level.)
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
