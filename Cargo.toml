[workspace]
resolver = "2"
members = [
    "crates/audit-core",
    "crates/audit-events",
    "crates/authorization",
    "crates/event-indexer",
    "crates/event-normalizer",
    "crates/evidence",
    "crates/integration-tests",
    "crates/integrity",
    "crates/investigation",
    "crates/storage",
    "crates/memory-store",
    "crates/privacy",
    "crates/reporting",
]

[workspace.package]
version = "0.1.0"
authors = ["Safeguard Inc."]
edition = "2021"
license = "MIT"
repository = "https://github.com/Safeguard-Inc/safeguard-audit"
keywords = ["stellar", "soroban", "confidential-tokens", "audit", "compliance"]
categories = ["cryptography", "database"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
